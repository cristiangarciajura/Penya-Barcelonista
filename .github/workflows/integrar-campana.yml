name: Integrar campana d'avisos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/integrar-campana.yml'
jobs:
  integrar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Integrar campana en index
        run: python3 scripts/instalar-campana.py
      - name: Publicar canvi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Moure avisos de portada a campana superior"
            git push
          fi
