name: Activar carrusel de noticias
on:
  push:
    paths:
      - '.github/workflows/activar-carrusel.yml'
      - 'home-quick-links.js'
      - 'home-quick-links.css'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Integrar carrusel sin reemplazar la web
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          if len(html.strip()) < 50000 or '<html' not in html.lower() or '</html>' not in html.lower() or '</body>' not in html.lower() or '</head>' not in html.lower():
              raise SystemExit('ERROR: index.html no contiene una página HTML completa. Se cancela la publicación para proteger la portada.')
          import re
          html=re.sub(r'<link[^>]*news-carousel-enhancement[.]css[^>]*>', '', html)
          html=re.sub(r'<script[^>]*news-carousel-enhancement[.]js[^>]*>\s*</script>', '', html)
          css='<link rel="stylesheet" href="./news-carousel-enhancement.css?v=20261109-fix3">'
          js='<script src="./news-carousel-enhancement.js?v=20261109-fix3" defer></script>'
          hide='<style>body:has(#pbsv-news-carousel:not([hidden])) #pbsv-public-news{display:none!important}</style>'
          if css not in html:
              html=html.replace('</head>',css+hide+'</head>',1)
          if js not in html:
              html=html.replace('</body>',js+'</body>',1)
          quick_css='<link rel="stylesheet" href="./home-quick-links.css?v=20261109-a">'
          quick_js='<script src="./home-quick-links.js?v=20261113-remove-agenda" defer></script>'
          if 'home-quick-links.css' not in html:
              html=html.replace('</head>',quick_css+'</head>',1)
          html=re.sub(r'<script[^>]*home-quick-links[.]js[^>]*>\\s*</script>', '', html)
          html=html.replace('</body>',quick_js+'</body>',1)
          if '</body>' not in html.lower() or '</head>' not in html.lower():
              raise SystemExit('ERROR: HTML inválido tras integrar recursos; no se guarda ningún cambio.')
          p.write_text(html,encoding='utf-8')
          PY
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Activar carrusel automático de noticias en portada"
            git push
          fi
