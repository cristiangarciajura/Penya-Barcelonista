name: Activar carrusel de noticias
on:
  push:
    paths:
      - '.github/workflows/activar-carrusel.yml'
      - 'home-quick-links.js'
      - 'home-quick-links.css'
      - 'news-carousel-enhancement.js'
      - 'news-carousel-enhancement.css'
      - 'weekend-matches.js'
      - 'weekend-matches.css'
      - 'directe-cap-setmana-link.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Integrar carrusel sin reemplazar la web
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          if len(html.strip()) < 50000 or '<html' not in html.lower() or '</html>' not in html.lower() or '</body>' not in html.lower() or '</head>' not in html.lower():
              raise SystemExit('ERROR: index.html no contiene una página HTML completa. Se cancela la publicación para proteger la portada.')
          import re
          # Versions explícites: la PWA no ha de servir scripts antics.
          resources=[
              ('news-carousel-enhancement.css','<link rel="stylesheet" href="./news-carousel-enhancement.css?v=20261113-mobile3">','head'),
              ('news-carousel-enhancement.js','<script src="./news-carousel-enhancement.js?v=20261113-mobile3" defer></script>','body'),
              ('weekend-matches.css','<link rel="stylesheet" href="./weekend-matches.css?v=20261113-mobile3">','head'),
              ('weekend-matches.js','<script src="./weekend-matches.js?v=20261113-mobile3" defer></script>','body'),
              ('home-quick-links.css','<link rel="stylesheet" href="./home-quick-links.css?v=20261113-mobile3">','head'),
              ('home-quick-links.js','<script src="./home-quick-links.js?v=20261113-mobile3" defer></script>','body'),
              ('directe-cap-setmana-link.js','<script src="./directe-cap-setmana-link.js?v=20261113-beta1" defer></script>','body'),
          ]
          for filename,tag,place in resources:
              html=re.sub(r'<script\b[^>]*'+re.escape(filename)+r'[^>]*>\s*</script>|<link\b[^>]*'+re.escape(filename)+r'[^>]*>', '', html, flags=re.I)
              closing='</head>' if place=='head' else '</body>'
              html=html.replace(closing,tag+closing,1)
          hide='<style>body:has(#pbsv-news-carousel:not([hidden])) #pbsv-public-news{display:none!important}</style>'
          if hide not in html:
              html=html.replace('</head>',hide+'</head>',1)
          if '</body>' not in html.lower() or '</head>' not in html.lower():
              raise SystemExit('ERROR: HTML inválido tras integrar recursos; no se guarda ningún cambio.')
          p.write_text(html,encoding='utf-8')
          PY
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Activar carrusel automático de noticias en portada"
            git push
          fi
