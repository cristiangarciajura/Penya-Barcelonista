name: Connectar El club amb el panell
on:
  push:
    paths:
      - 'scripts/integrar-club.py'
      - '.github/workflows/integrar-club.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connectar dades sense reconstruir la web
        run: python3 scripts/integrar-club.py
      - name: Validar connexió
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'id="pbsv-club-data-script"' in s
          assert "fetch('./data/club.json'" in s
          assert 'id="club"' in s
          PY
      - name: Guardar canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Connectar El club amb dades administrables"
            git push
          fi
