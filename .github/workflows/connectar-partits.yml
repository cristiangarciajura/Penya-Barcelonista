name: Connectar partits del cap de setmana
on:
  push:
    paths:
      - '.github/workflows/connectar-partits.yml'
      - 'weekend-matches.js'
      - 'weekend-matches.css'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  connectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Afegir recursos sense substituir la portada
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./weekend-matches.css?v=20261110-1">'
          js='<script src="./weekend-matches.js?v=20261110-1" defer></script>'
          if 'weekend-matches.css' not in s: s=s.replace('</head>',css+'</head>',1)
          if 'weekend-matches.js' not in s: s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Connectar les targetes dels partits amb el nou editor"
            git push
          fi
