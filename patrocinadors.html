<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrocinadors · PBSV</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#17233d;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.top{background:#152b5a;color:white;padding:20px}.wrap{max-width:1060px;margin:auto;padding:0 18px}a{color:inherit}.top a{text-decoration:none;font-weight:700}.head{padding:42px 0 12px}h1{font-size:clamp(30px,5vw,44px);margin:0}p{color:#657187}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding:24px 0 60px}.card{background:white;border:1px solid #e2e7f0;border-radius:16px;overflow:hidden;box-shadow:0 8px 22px #12214b0a;display:flex;flex-direction:column}.logo{height:145px;background:linear-gradient(135deg,#e9f0fb,#f9e8ed);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-weight:800;color:#20457e;font-size:20px}.logo img{max-width:100%;max-height:110px;object-fit:contain}.body{padding:18px;flex:1;display:flex;flex-direction:column}.body h2{font-size:18px;margin:0 0 18px}.body a{margin-top:auto;display:inline-block;background:#153e87;color:white;text-decoration:none;border-radius:9px;padding:10px 12px;text-align:center;font-weight:700}.note{font-size:13px}footer{padding:20px;background:#152b5a;color:white}footer p{color:#e2e8f4}
</style></head><body><div class="top"><div class="wrap"><a href="./index.html">← PBSV · Inici / Inicio</a></div></div><main class="wrap"><div class="head"><h1 id="title">Patrocinadors i col·laboradors</h1><p id="intro">Gràcies per fer costat al nostre club.</p><button id="lang" style="border:1px solid #d1d9e6;background:white;padding:8px 12px;border-radius:8px">Castellano</button></div><div class="grid" id="cards" aria-live="polite"></div><p class="note" id="note">Les imatges corporatives s'afegiran quan estiguin verificades.</p></main><footer><div class="wrap"><p>Penya Barcelonista Sant Vicenç dels Horts</p></div></footer>
<script>
let language='ca';
const fallback=[{name:'Recuperaciones y Transportes Santiago Rubio',url:'https://www.instagram.com/recuptrans.santiago?vrfl=MW4zcmtsaWExOWxhNA=='},{name:'Pneumàtics García',url:'https://www.instagram.com/pneumaticsgarciagt?xtok=dXZmcGVuajlwZDZj'},{name:'Transmar',url:'https://transmar.net/es/'},{name:'Ajuntament Sant Vicenç dels Horts',url:'https://svh.cat/'},{name:'Agrupació FCB',url:'https://agrupaciofcb.cat/'}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sponsors=fallback;
function draw(){document.documentElement.lang=language;document.getElementById('title').textContent=language==='ca'?'Patrocinadors i col·laboradors':'Patrocinadores y colaboradores';document.getElementById('intro').textContent=language==='ca'?'Gràcies per fer costat al nostre club.':'Gracias por apoyar a nuestro club.';document.getElementById('lang').textContent=language==='ca'?'Castellano':'Català';document.getElementById('note').textContent=language==='ca'?'Els logotips oficials s’afegiran quan estiguin verificats.':'Los logotipos oficiales se añadirán cuando estén verificados.';document.getElementById('cards').replaceChildren(...sponsors.map(s=>{const card=document.createElement('article');card.className='card';const logo=document.createElement('div');logo.className='logo';if(s.image&&/^(\.\/|assets\/|https:\/\/)/.test(s.image)){const img=document.createElement('img');img.src=s.image;img.alt=s.name;img.onerror=()=>logo.replaceChildren(document.createTextNode(s.name));logo.append(img)}else logo.textContent=s.name;const body=document.createElement('div');body.className='body';const h=document.createElement('h2');h.textContent=s.name;const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=language==='ca'?'Visitar web / xarxa social ↗':'Visitar web / red social ↗';body.append(h,a);card.append(logo,body);return card}))}
document.getElementById('lang').onclick=()=>{language=language==='ca'?'es':'ca';draw()};draw();fetch('./data/patrocinadors.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('No data');return r.json()}).then(d=>{if(Array.isArray(d.sponsors)){sponsors=d.sponsors.filter(s=>typeof s.name==='string'&&typeof s.url==='string'&&/^https:\/\//.test(s.url));draw()}}).catch(()=>{});
</script></body></html>
